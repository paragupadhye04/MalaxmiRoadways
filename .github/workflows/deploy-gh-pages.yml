name: Build and deploy to GitHub Pages

# Ensure only one deploy runs at a time for the main branch
concurrency:
  group: deploy-gh-pages-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]

# Required permissions for publishing to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check Node & npm versions
        run: |
          node --version
          npm --version

      - name: Show package.json scripts (debug)
        run: |
          node -p "JSON.stringify(require('./package.json').scripts, null, 2)"

      - name: Install dependencies (verbose, try ci then install)
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          # Remove any checked-in node_modules to avoid permission/lock issues on runner
          if [ -d "node_modules" ]; then rm -rf node_modules || true; fi
          echo "Running npm ci (verbose)"
          npm ci --loglevel verbose || (echo "npm ci failed, falling back to npm install" && npm install --loglevel verbose)

      - name: Build
        run: npm run build

      - name: Ensure SPA fallback (copy index.html -> 404.html)
        run: |
          if [ -d "dist" ]; then
            cp dist/index.html dist/404.html || true
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
