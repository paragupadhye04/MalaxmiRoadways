name: Build and deploy to GitHub Pages

# Ensure only one deploy runs at a time for the main branch
concurrency:
  group: deploy-gh-pages-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]

# Required permissions for publishing to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check Node & npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies (try ci, fallback to install)
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Ensure SPA fallback (copy index.html -> 404.html)
        run: |
          if [ -d "dist" ]; then
            cp dist/index.html dist/404.html || true
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
