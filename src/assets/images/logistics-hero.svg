<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="600" fill="#f8fafc"/>
    <g transform="translate(100, 100)">
        <!-- Truck body -->
        <rect x="200" y="200" width="400" height="200" fill="#1a365d" rx="20"/>
        <rect x="500" y="250" width="100" height="150" fill="#2c5282"/>
        <!-- Wheels -->
        <circle cx="250" cy="420" r="40" fill="#2d3748"/>
        <circle cx="550" cy="420" r="40" fill="#2d3748"/>
        <!-- Windows -->
        <rect x="520" y="270" width="60" height="80" fill="#90cdf4" rx="10"/>
        <!-- Cargo container -->
        <rect x="200" y="220" width="300" height="160" fill="#2c5282" rx="10"/>
        <!-- Company name -->
        <text x="250" y="300" fill="#ffffff" font-family="Arial" font-size="24">MAHALAXMI</text>
        <text x="270" y="330" fill="#ffffff" font-family="Arial" font-size="20">TRANSPORT</text>
    </g>
</svg>