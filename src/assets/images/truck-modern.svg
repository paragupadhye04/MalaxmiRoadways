<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="600px" viewBox="0 0 800 600" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="600" fill="#f8fafc"/>
    <g transform="translate(50, 50)">
        <!-- Truck cabin -->
        <rect x="500" y="200" width="200" height="150" fill="#1a365d" rx="20"/>
        <!-- Truck body -->
        <rect x="100" y="250" width="400" height="100" fill="#2c5282"/>
        <!-- Wheels -->
        <circle cx="200" cy="400" r="50" fill="#2d3748"/>
        <circle cx="600" cy="400" r="50" fill="#2d3748"/>
        <!-- Windows -->
        <rect x="550" y="220" width="100" height="80" fill="#90cdf4" rx="10"/>
        <!-- Logo -->
        <rect x="150" y="270" width="300" height="60" fill="#1a365d"/>
        <text x="180" y="310" fill="#ffffff" font-family="Arial" font-size="30">MAHALAXMI</text>
    </g>
</svg>